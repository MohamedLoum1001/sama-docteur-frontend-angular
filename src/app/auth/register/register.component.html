<div class="container mt-2">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="text-center mb-4">
        <h3 class="mt-2 fw-bold text-primary">Inscription</h3>
      </div>
      <div class="card shadow-lg p-4 border-0 rounded-4">
        <form>

          <!-- Prénom et Nom -->
          <div class="row">
            <div class="mb-1 col-md-6">
              <label class="form-label">Prénom</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-user"></i>
                </span>
                <input type="text" class="form-control border-start-0 rounded-end-pill px-2 py-2"
                  placeholder="Entrez votre prénom" />
              </div>
            </div>
            <div class="mb-1 col-md-6">
              <label class="form-label">Nom</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-user"></i>
                </span>
                <input type="text" class="form-control border-start-0 rounded-end-pill px-2 py-2"
                  placeholder="Entrez votre nom" />
              </div>
            </div>
          </div>

          <!-- Email et Adresse -->
          <div class="row">
            <div class="mb-1 col-md-6">
              <label class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-envelope"></i>
                </span>
                <input type="email" class="form-control border-start-0 rounded-end-pill px-2 py-2"
                  placeholder="Entrez votre email" />
              </div>
            </div>
            <div class="mb-1 col-md-6">
              <label class="form-label">Adresse</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-map-marker-alt"></i>
                </span>
                <input type="text" class="form-control border-start-0 rounded-end-pill px-2 py-2"
                  placeholder="Entrez votre adresse" />
              </div>
            </div>
          </div>

          <!-- Téléphone et Rôle -->
          <div class="row">
            <div class="mb-1 col-md-6">
              <label class="form-label">Téléphone</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-phone"></i>
                </span>
                <input type="text" class="form-control border-start-0 rounded-end-pill px-2 py-2"
                  placeholder="Entrez votre téléphone" />
              </div>
            </div>
            <div class="mb-1 col-md-6">
              <label class="form-label">Rôle</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-start-0 rounded-start-pill">
                  <i class="fa fa-id-badge"></i>
                </span>
                <select class="form-select border-start-0 rounded-end-pill px-2 py-2">
                  <option value="">Sélectionnez un rôle</option>
                  <option value="PATIENT">PATIENT</option>
                  <option value="ADMIN">ADMIN</option>
                  <option value="MEDECIN">MEDECIN</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Password et Confirm Password -->
          <div class="row">
            <div class="mb-1 col-md-6">
              <label class="form-label">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                  <i class="fa fa-lock"></i>
                </span>
                <input type="password" class="form-control border-end-0 px-3 py-2" placeholder="Mot de passe" />
              </div>
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">Confirmer le mot de passe</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                  <i class="fa fa-lock"></i>
                </span>
                <input type="password" class="form-control border-end-0 px-3 py-2"
                  placeholder="Confirmer le mot de passe" />
              </div>
            </div>
          </div>

          <!-- Bouton S'inscrire -->
          <button type="submit" class="btn w-100 mb-3 rounded-pill text-white" style="background-color: #00a5a8;">
            S'inscrire
          </button>

          <!-- Bouton Se connecter avec navigation -->
          <button type="button" (click)="loginData()" class="btn w-100 rounded-pill text-white"
            style="background-color: #0b89c4">
            Se connecter
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
